<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiGov Connect — Government News & Benefits Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef2f7; --bg2:#e6ecf5; --bg3:#dfe7f2;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.8);
  --glass-border:rgba(255,255,255,.65); --glass-inner:rgba(255,255,255,.35);
  --txt:#1c2430; --txt2:#5a6675; --txt3:#8a95a5;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.12);
  --benefit:#0e9f6e; --benefit-soft:rgba(14,159,110,.12);
  --shadow:0 8px 32px rgba(30,45,70,.12); --shadow-sm:0 2px 12px rgba(30,45,70,.08);
  --radius:22px; --radius-sm:14px; --warn:#d97706;
  --menu-bg:#ffffff;
}
html[data-theme="dark"]{
  --bg1:#0d1420; --bg2:#111a2a; --bg3:#0f1726;
  --glass:rgba(23,32,48,.55); --glass-strong:rgba(26,36,54,.9);
  --glass-border:rgba(255,255,255,.09); --glass-inner:rgba(255,255,255,.04);
  --txt:#e8edf5; --txt2:#a3aebf; --txt3:#6b7688;
  --accent:#5b8cff; --accent-soft:rgba(91,140,255,.16);
  --benefit:#2fbf8a; --benefit-soft:rgba(47,191,138,.14);
  --shadow:0 8px 32px rgba(0,0,0,.45); --shadow-sm:0 2px 12px rgba(0,0,0,.3);
  --menu-bg:#1b2333;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'IBM Plex Sans Thai','Inter',-apple-system,sans-serif;
  color:var(--txt); background:var(--bg1); min-height:100vh;
  transition:background .4s,color .4s; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(96,165,250,.18), transparent 60%),
    radial-gradient(1000px 600px at 95% 15%, rgba(167,139,250,.12), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
}
html[data-theme="dark"] body::before{
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(59,110,220,.16), transparent 60%),
    radial-gradient(1000px 600px at 95% 15%, rgba(124,90,240,.11), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
}
.glass{
  background:var(--glass); border:1px solid var(--glass-border);
  backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-inner); border-radius:var(--radius);
}
/* ===== Header ===== */
header{
  position:sticky; top:12px; z-index:100; margin:12px auto 0; max-width:1120px;
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  border-radius:26px; width:calc(100% - 28px);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.brand-logo{height:32px;width:auto;flex:none;display:block}
html[data-theme="dark"] .brand-logo{background:#fff;border-radius:9px;padding:4px 8px;height:34px;box-sizing:border-box}
.brand-sep{width:1px;height:30px;background:var(--glass-border);flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand small{font-size:10.5px;color:var(--txt2);font-weight:500;display:block;letter-spacing:.02em}
nav.main{display:flex;gap:4px;margin-left:8px}
nav.main button{
  border:none;background:transparent;color:var(--txt2);font-family:inherit;font-size:14px;
  font-weight:600;padding:8px 15px;border-radius:12px;cursor:pointer;transition:.25s;
}
nav.main button:hover{color:var(--txt);background:var(--glass-inner)}
nav.main button.active{background:var(--accent-soft);color:var(--accent)}
.hspace{flex:1}
.hbtn{
  border:1px solid var(--glass-border);background:var(--glass-inner);color:var(--txt2);
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;cursor:pointer;transition:.25s;flex:none;
}
.hbtn:hover{color:var(--txt);transform:translateY(-1px)}
.lang-toggle{display:flex;border:1px solid var(--glass-border);border-radius:11px;overflow:hidden;background:var(--glass-inner);flex:none}
.lang-toggle button{
  border:none;background:transparent;color:var(--txt3);font-family:inherit;font-weight:700;
  font-size:12px;padding:8px 11px;cursor:pointer;transition:.2s;
}
.lang-toggle button.active{background:var(--accent);color:#fff}
/* ===== Layout ===== */
.wrap{max-width:1120px;margin:0 auto;padding:22px 14px 80px}
/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;position:relative;z-index:500}
/* ministry dropdown */
.dd{position:relative}
.dd-btn{
  display:flex;align-items:center;gap:9px;height:42px;padding:0 15px;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--txt);border:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);box-shadow:var(--shadow-sm);
}
.dd-btn .chev{transition:.25s;color:var(--txt3)}
.dd.open .dd-btn .chev{transform:rotate(180deg)}
.dd-menu{
  position:absolute;top:calc(100% + 8px);left:0;min-width:360px;z-index:900;padding:8px;
  border-radius:18px;display:none;background:var(--menu-bg);border:1px solid var(--glass-border);
  box-shadow:0 20px 50px rgba(15,25,45,.28);max-height:min(62vh,540px);overflow-y:auto;
}
html[data-theme="dark"] .dd-menu{box-shadow:0 20px 50px rgba(0,0,0,.6)}
html[data-theme="dark"] .sug{box-shadow:0 28px 64px rgba(0,0,0,.7),0 4px 14px rgba(0,0,0,.4)}
.dd.open .dd-btn{border-color:var(--accent)}
.dd-item{
  position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  cursor:pointer;transition:.15s;flex-wrap:wrap;
}
.dd-item:hover,.dd-item.sel{background:var(--accent-soft)}
.dd-item .min-logo,.dd-item .min-logo-fb{width:28px;height:28px}
.dd-item .dn2{flex:1;font-size:13px;font-weight:600;line-height:1.25}
.dd-item .dn2 small{display:block;font-size:10.5px;color:var(--txt3);font-weight:500}
.min-logo{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff;padding:2px;flex:none;border:1px solid rgba(0,0,0,.06)}
.min-logo-fb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.star{border:none;background:transparent;cursor:pointer;color:var(--txt3);display:grid;place-items:center;padding:4px;border-radius:8px}
.star.on{color:#f59e0b}
.star:hover{background:var(--glass-inner)}
/* hover-open dropdowns: stay while pointer inside, fade in/out */
.dd::after{content:"";position:absolute;top:100%;left:0;height:16px;width:min(420px,86vw);pointer-events:none}
.dd:hover::after,.dd.open::after{pointer-events:auto}
.dd .dd-menu{display:block;opacity:0;visibility:hidden;transform:translateY(7px) scale(.985);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .35s}
.dd.open .dd-menu,.dd:hover .dd-menu{opacity:1;visibility:visible;transform:none;transition:opacity .18s ease,transform .18s ease,visibility 0s}
.dd.closing .dd-menu{opacity:0!important;visibility:hidden!important;transition:none!important}
.dd.closing::after{pointer-events:none!important}
/* category tabs inside ministry dropdown */
.dd-tabs{display:flex;gap:4px;padding:2px 2px 8px;position:sticky;top:-8px;background:var(--menu-bg);z-index:2;border-bottom:1px solid var(--glass-border);margin-bottom:6px}
.dd-tabs button{flex:1;border:1px solid var(--glass-border);background:transparent;color:var(--txt2);font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.dd-tabs button:hover{color:var(--accent)}
.dd-tabs button.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}
/* filter dropdowns (type & status) */
.fdd .dd-menu{min-width:190px}
.fd-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--txt);transition:.15s}
.fd-item:hover,.fd-item.sel{background:var(--accent-soft);color:var(--accent)}
.fd-item .cnt{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.refresh-btn{
  display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--txt2);border:1px solid var(--glass-border);
}
.refresh-btn:hover{color:var(--accent)}
.refresh-btn svg{flex:none}
.refresh-btn.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section{animation:fadeUp .32s ease both}
.card{animation:fadeUp .34s ease both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.2s}.card:nth-child(7){animation-delay:.24s}
.card:nth-child(8){animation-delay:.28s}
.min-hero,.agency-box{animation:fadeUp .38s ease both}
.src-item,.sg-item,.dd-item,.fd-item{animation:fadeUp .22s ease both}
.agency-chip{animation:fadeUp .3s ease both}
body,.glass,.card,.dd-btn,.hbtn,nav.main button{transition-property:background,background-color,color,border-color,box-shadow,transform,opacity;transition-duration:.25s}
.agency-box{padding:14px 16px;margin-bottom:16px}
.agency-box .ab-title{font-size:12px;font-weight:700;color:var(--txt2);letter-spacing:.03em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.agency-chips{display:flex;flex-wrap:wrap;gap:6px}
.agency-chip{font-size:11.5px;font-weight:500;padding:4px 11px 4px 6px;border-radius:20px;background:var(--glass-inner);border:1px solid var(--glass-border);color:var(--txt2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.agency-chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.agency-chip.sel{background:var(--accent)!important;color:#fff!important;border-color:transparent}
.agency-chip .min-logo,.agency-chip .min-logo-fb{width:17px;height:17px;font-size:6px;padding:1px}
.agency-chip.se{background:var(--benefit-soft);color:var(--benefit);border-color:transparent}
.agency-chip.po{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dd-btn .min-logo,.dd-btn .min-logo-fb{width:22px;height:22px;font-size:8px;flex:none}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;padding:0 14px;border-radius:14px;height:42px;position:relative}
.search input{flex:1;border:none;background:transparent;outline:none;color:var(--txt);font-family:inherit;font-size:14px}
.search input::placeholder{color:var(--txt3)}
.search .sx{border:none;background:transparent;color:var(--txt3);cursor:pointer;display:none;padding:2px;line-height:0}
.search .sx:hover{color:var(--txt)}
.sug{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:1000;display:none;
  background:var(--menu-bg);border:1px solid var(--glass-border);border-radius:16px;backdrop-filter:none;
  box-shadow:0 28px 64px rgba(15,25,45,.4),0 4px 14px rgba(15,25,45,.18);overflow:hidden;max-height:min(50vh,420px);overflow-y:auto;
}
.sug{display:block;opacity:0;visibility:hidden;transform:translateY(7px);pointer-events:none;transition:opacity .22s ease,transform .22s ease,visibility .22s}
.sug.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.sug .sg-head{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--txt3);padding:10px 14px 4px;text-transform:uppercase}
.sug .sg-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:var(--txt)}
.sug .sg-item:hover{background:var(--accent-soft)}
.sug .sg-item small{color:var(--txt3);font-size:11px;margin-left:auto;flex:none}
.sug .sg-item .min-logo,.sug .sg-item .min-logo-fb{width:24px;height:24px;font-size:8px}
.sug .sg-item .sg-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug mark{background:transparent;color:var(--accent);font-weight:700}
/* ministry hero */
.min-hero{display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:22px;margin:14px 0 4px;position:relative;overflow:hidden}
.min-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--hero),transparent 65%);opacity:.14;pointer-events:none}
.min-hero .hero-logo .min-logo,.min-hero .hero-logo .min-logo-fb{width:72px;height:72px;font-size:22px;background:#fff;padding:5px;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.22)}
.hero-link{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:4px 11px;border-radius:20px;transition:.2s}
.hero-link:hover{transform:translateY(-1px);text-decoration:underline}
.min-hero .hero-txt h2{font-size:clamp(19px,3.4vw,28px);font-weight:800;line-height:1.25;margin:0}
.min-hero .hero-txt p{margin:4px 0 0;font-size:13px;color:var(--txt2)}
.min-hero .hero-x{margin-left:auto;flex:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--txt2)}
.min-hero .hero-x:hover{color:var(--txt)}
/* saved marker on cards' ministry (clickable) */
.card-top .min-link{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.card-top .min-link:hover .card-min{color:var(--accent);text-decoration:underline}
/* saved events in calendar */
.cal-bar.sv{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.28)}
.cal-bar.sv .svstar{margin-right:3px}
.seg{display:flex;border-radius:14px;overflow:hidden;height:42px}
.seg button{
  border:none;background:transparent;color:var(--txt2);font-family:inherit;font-size:13px;font-weight:600;
  padding:0 15px;cursor:pointer;transition:.2s;
}
.seg button.active{background:var(--accent);color:#fff}
.seg button.active.bft{background:var(--benefit)}
/* feed */
.feed-head{display:flex;align-items:center;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.feed-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.feed-head .fh-count{font-size:13px;color:var(--txt3)}
.clear-min{
  display:inline-flex;align-items:center;gap:6px;border:none;background:var(--accent-soft);color:var(--accent);
  font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{padding:18px;cursor:pointer;transition:.3s;display:flex;flex-direction:column;gap:11px;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 44px rgba(30,45,70,.18)}
html[data-theme="dark"] .card:hover{box-shadow:0 16px 44px rgba(0,0,0,.55)}
.card-top{display:flex;align-items:center;gap:9px}
.card-top .min-logo,.card-top .min-logo-fb{width:26px;height:26px;font-size:10px}
.card-min{font-size:12px;font-weight:600;color:var(--txt2);flex:1;line-height:1.2}
.badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.03em;flex:none}
.badge.news{background:var(--accent-soft);color:var(--accent)}
.badge.benefit{background:var(--benefit-soft);color:var(--benefit)}
.card h3{font-size:15.5px;font-weight:700;line-height:1.45;letter-spacing:-.01em;padding-right:20px}
.card p{font-size:13px;color:var(--txt2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eng-tags{display:flex;gap:6px;flex-wrap:wrap}
.eng-tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--benefit-soft);color:var(--benefit);display:inline-flex;align-items:center;gap:5px}
.card-meta{display:flex;align-items:center;gap:14px;margin-top:auto;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--txt3)}
.countdown{font-size:11px;font-weight:700;color:var(--warn);background:rgba(217,119,6,.12);padding:3px 9px;border-radius:20px}
.countdown.past{color:var(--txt3);background:var(--glass-inner)}
.countdown.ongoing{color:var(--benefit);background:var(--benefit-soft)}
a.src-item{text-decoration:none;color:inherit}
.sg-apply{color:var(--accent)}
.sg-apply svg{flex:none}
.card.is-past{opacity:.62}
.card.is-past:hover{opacity:1}
.bookmark-btn{
  position:absolute;top:14px;right:14px;border:none;background:transparent;color:var(--txt3);
  cursor:pointer;padding:4px;border-radius:8px;transition:.2s;display:none;
}
.card:hover .bookmark-btn{display:block}
.bookmark-btn.on{display:block;color:var(--accent)}
.empty{padding:60px 20px;text-align:center;color:var(--txt3);font-size:14px}
/* ===== modal ===== */
.overlay{
  position:fixed;inset:0;background:rgba(15,22,35,.4);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-start;justify-content:center;
  padding:5vh 14px;overflow-y:auto;
}
.overlay.open{display:flex}
.modal{max-width:680px;width:100%;padding:26px;animation:up .3s cubic-bezier(.2,.9,.3,1);background:var(--glass-strong)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.modal-top{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.modal-top .min-logo,.modal-top .min-logo-fb{width:40px;height:40px}
.modal-min{flex:1}
.modal-min b{font-size:14px;display:block}
.modal-min span{font-size:12px;color:var(--txt3)}
.close-btn{border:none;background:var(--glass-inner);color:var(--txt2);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.modal h2{font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.01em;margin-bottom:14px}
.ai-box{
  border-radius:var(--radius-sm);padding:15px 16px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(37,99,235,.09),rgba(124,58,237,.08));
  border:1px solid rgba(37,99,235,.18);
}
.ai-box .ai-tag{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:8px;letter-spacing:.04em}
.ai-box p{font-size:13.5px;line-height:1.75;color:var(--txt)}
.bkb-box{
  border-radius:var(--radius-sm);padding:15px 16px;margin-bottom:18px;
  background:var(--benefit-soft);border:1px solid rgba(14,159,110,.25);
}
.bkb-box .ai-tag{color:var(--benefit)}
.bkb-box p{font-size:13.5px;line-height:1.75;color:var(--txt)}
.bkb-box .eng-tags{margin-top:9px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.detail-cell{border-radius:var(--radius-sm);padding:12px 14px;background:var(--glass-inner);border:1px solid var(--glass-border)}
.detail-cell.full{grid-column:1/-1}
.detail-cell .dl{font-size:10.5px;font-weight:700;color:var(--txt3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.detail-cell .dv{font-size:13.5px;font-weight:500;line-height:1.55}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;border:none;font-family:inherit;font-size:13.5px;
  font-weight:600;padding:11px 18px;border-radius:13px;cursor:pointer;transition:.25s;text-decoration:none;
}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--glass-inner);color:var(--txt);border:1px solid var(--glass-border)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.card-img{width:calc(100% + 2px);margin:-1px -1px 12px;border-radius:14px 14px 0 0;display:block;
  aspect-ratio:16/7;object-fit:cover;background:var(--glass-inner)}
.modal-img{width:100%;border-radius:14px;margin-bottom:14px;max-height:340px;object-fit:cover;display:block;background:var(--glass-inner)}
.live-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;border-radius:14px;margin-bottom:16px;
  font-size:12.5px;font-weight:600;border:1px solid rgba(217,119,6,.35);background:rgba(245,158,11,.1);color:#b45309}
html[data-theme="dark"] .live-note{color:#fbbf24;background:rgba(245,158,11,.12)}
.live-note.on{border-color:rgba(5,150,105,.35);background:rgba(16,185,129,.1);color:#047857}
html[data-theme="dark"] .live-note.on{color:#34d399}
.live-note .lnb{margin-left:auto;border:none;border-radius:999px;padding:6px 13px;font-family:inherit;font-size:11.5px;font-weight:700;
  cursor:pointer;background:#b45309;color:#fff;flex:none}
.live-note.on .lnb{display:none}
.live-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ext-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:2.5px 8px;border-radius:999px;background:rgba(100,116,139,.14);color:var(--txt2);
  border:1px solid var(--glass-border);flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext-tag.gn{background:rgba(37,99,235,.1);color:var(--accent)}
html[data-theme="dark"] .ext-tag{background:rgba(148,163,184,.14)}

/* ===== calendar ===== */
.cal-panel{padding:20px}
.cal-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--glass-border);
  background:var(--glass-inner);color:var(--txt2);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s}
.cchip:hover{border-color:var(--accent);color:var(--txt)}
.cchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cchip .cnt{font-size:10.5px;font-weight:700;background:rgba(0,0,0,.14);border-radius:999px;padding:1px 7px}
.cchip.on .cnt{background:rgba(255,255,255,.25)}
.cal-legend span.lg{cursor:pointer;padding:4px 9px;border-radius:999px;border:1px solid transparent;transition:.15s}
.cal-legend span.lg:hover{border-color:var(--glass-border);background:var(--glass-inner)}
.cal-legend span.lg.on{border-color:var(--accent);background:var(--accent-soft);color:var(--txt)}
.cal-legend span.lg.dim{opacity:.38}
.cal-hint{font-size:11px;color:var(--txt3);margin-top:8px}
.cal-agenda{margin-top:20px;border-top:1px solid var(--glass-border);padding-top:16px}
.cal-agenda h4{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.agn-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:.15s}
.agn-row:hover{background:var(--accent-soft)}
.agn-date{flex:none;width:86px;font-size:11.5px;font-weight:700;color:var(--txt2);line-height:1.3}
.agn-date.today{color:var(--accent)}
.agn-dot{flex:none;width:11px;height:11px;border-radius:3px}
.agn-t{flex:1;font-size:13px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agn-t small{display:block;font-size:10.5px;font-weight:500;color:var(--txt3)}
.agn-tags{flex:none;display:flex;gap:5px;align-items:center;font-size:10px}
.agn-b{background:#059669;color:#fff;border-radius:6px;padding:2px 7px;font-weight:700}
.agn-sv{color:#f59e0b;font-size:13px}
.cal-empty{padding:22px;text-align:center;color:var(--txt3);font-size:13px}
@media (max-width:640px){.agn-date{width:64px}.agn-t{white-space:normal}}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-nav h3{font-size:18px;font-weight:700;flex:1}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--txt3);text-align:center;padding:4px 0;letter-spacing:.05em}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);column-gap:6px;margin-bottom:6px;min-height:92px;grid-auto-rows:min-content}
.day-bg{border-radius:12px;background:var(--glass-inner);border:1px solid var(--glass-border);grid-row:1/span 9}
.day-bg.out{opacity:.35}
.day-num{grid-row:1;z-index:1;font-size:11.5px;font-weight:600;color:var(--txt2);padding:6px 0 4px 9px;pointer-events:none}
.day-num.out{color:var(--txt3);opacity:.6}
.day-num .tn{display:inline-grid;place-items:center;width:22px;height:22px;background:var(--accent);color:#fff;border-radius:8px}
.cal-bar{
  z-index:1;font-size:10.5px;font-weight:600;color:#fff;padding:3px 8px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 4px;border-radius:7px;transition:.15s;
}
.cal-bar:hover{filter:brightness(1.12)}
.cal-bar.contL{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-6px}
.cal-bar.contR{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-6px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2)}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* ===== AI reader ===== */
.ai-panel{padding:24px}
.ai-panel h2{font-size:18px;font-weight:700;margin-bottom:6px}
.ai-panel .sub{font-size:13px;color:var(--txt2);line-height:1.7;margin-bottom:16px;max-width:640px}
.ai-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.ai-cols{grid-template-columns:1fr}}
.ai-col{border-radius:16px;padding:16px;background:var(--glass-inner);border:1px solid var(--glass-border)}
.ai-col h4{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ai-col textarea{
  width:100%;min-height:130px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);
  color:var(--txt);font-family:inherit;font-size:13px;padding:11px;resize:vertical;outline:none;line-height:1.6;
}
.drop{
  border:1.5px dashed var(--glass-border);border-radius:12px;min-height:130px;display:grid;place-items:center;
  color:var(--txt3);font-size:12.5px;text-align:center;padding:14px;cursor:pointer;transition:.2s;line-height:1.7;
}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop img{max-width:100%;max-height:150px;border-radius:8px}
.ai-result{margin-top:12px;font-size:12.5px;line-height:1.7;color:var(--txt2)}
.ai-result b{color:var(--txt)}
.src-list{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.src-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;background:var(--glass-inner);border:1px solid var(--glass-border)}
.src-item .min-logo,.src-item .min-logo-fb{width:24px;height:24px;font-size:9px}
.src-item .sn{flex:1;font-size:12px;font-weight:600;line-height:1.3}
.src-item .st{font-size:10px;font-weight:700;color:var(--benefit);background:var(--benefit-soft);padding:3px 8px;border-radius:12px;white-space:nowrap}
/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:300;
  padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.35s;
  background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(20px);
  box-shadow:var(--shadow);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:12px;color:var(--txt3);padding:30px 14px 10px;line-height:1.8}
@media (max-width:720px){
  nav.main{display:none}
  .mobile-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:150;display:flex;gap:4px;padding:6px;border-radius:20px}
  .mobile-nav button{
    border:none;background:transparent;color:var(--txt2);font-family:inherit;font-size:12px;font-weight:600;
    padding:9px 15px;border-radius:14px;cursor:pointer;
  }
  .mobile-nav button.active{background:var(--accent-soft);color:var(--accent)}
  .detail-grid{grid-template-columns:1fr}
  .cal-week{min-height:64px}
  .brand small{display:none}
  .wrap{padding-bottom:110px}
  .dd-menu{min-width:290px}
  .dd-tabs button{font-size:10px;padding:6px 2px}
}
@media (min-width:721px){.mobile-nav{display:none}}
</style>

/* ---------- helpers ---------- */
function fmtDate(isoStr){
  if(!isoStr)return"—";
  const[y,m,d]=isoStr.split("-").map(Number);
  if(S.lang==="th"){
    const mo=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    return d+" "+mo[m-1]+" "+(y+543);
  }
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mo[m-1]+" "+d+", "+y;
}
function fmtRange(it){
  if(!it.evStart)return"—";
  if(!it.evEnd||it.evEnd===it.evStart)return fmtDate(it.evStart);
  return fmtDate(it.evStart)+" – "+fmtDate(it.evEnd);
}
function todayISO(){
  const n=new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function daysUntil2(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function countdownHTML(it){
  if(!it.evStart)return"";
  const t=todayISO(),end=it.evEnd||it.evStart;
  if(end<t)return'<span class="countdown past">'+T("past")+"</span>";
  if(it.evStart<=t)return'<span class="countdown ongoing">'+T("ongoing")+"</span>";
  const d=daysUntil2(t,it.evStart);
  return'<span class="countdown">'+(d===0?T("daysToday"):T("daysLeft").replace("{d}",d))+"</span>";
}
function mlErr(img,minId){
  const m=MINISTRIES[minId];
  if(!m){img.remove();return}
  if(!img.dataset.f&&m.web){ // step 2: favicon ของเว็บทางการ
    img.dataset.f="1";
    img.src="https://www.google.com/s2/favicons?domain="+m.web+"&sz=64";
    return;
  }
  const d=document.createElement("div"); // step 3: วงกลมสีพร้อมตัวย่อ
  d.className="min-logo-fb";d.style.background=m.color;d.textContent=m.abbr;
  img.replaceWith(d);
}
function logoHTML(minId){
  const m=MINISTRIES[minId];
  if(!m)return"";
  return'<img class="min-logo" src="'+m.logo+'" alt="" loading="lazy" onerror="mlErr(this,\''+minId+'\')">';
}

function engTagsHTML(it){
  if(!it.eng||!it.eng.length)return"";
  const L={p:T("engP"),s:T("engS"),c:T("engC")};
  return'<div class="eng-tags">'+it.eng.map(k=>'<span class="eng-tag">'+ENG_ICONS[k]+L[k]+"</span>").join("")+"</div>";
}
function gcalURL(it){
  const fmt=s=>s.replace(/-/g,"");
  let dates="";
  if(it.evStart){
    const end=new Date((it.evEnd||it.evStart)+"T00:00:00");
    end.setDate(end.getDate()+1);
    const endISO=end.getFullYear()+"-"+String(end.getMonth()+1).padStart(2,"0")+"-"+String(end.getDate()).padStart(2,"0");
    dates=fmt(it.evStart)+"/"+fmt(endISO);
  }
  const m=MINISTRIES[it.min];
  const details=T("aiTag")+": "+it.sum+"\n\n"+
    (it.bkb?T("bkbTag")+": "+it.bkb+"\n\n":"")+
    (it.chair?T("dChair")+": "+it.chair+"\n":"")+
    (it.time?T("dTime")+": "+it.time+"\n":"")+
    (m?(S.lang==="th"?m.th:m.en)+"\n":"")+
    (it.src?it.src:"");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(it.title)+
    (dates?"&dates="+dates:"")+
    "&details="+encodeURIComponent(details)+
    (it.loc?"&location="+encodeURIComponent(it.loc):"");
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- i18n / theme / views ---------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T(el.getAttribute("data-i18n"))});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=T(el.getAttribute("data-i18n-ph"))});
  document.documentElement.lang=S.lang;
}
function setLang(l){
  S.lang=l;persist();
  document.getElementById("lang-th").classList.toggle("active",l==="th");
  document.getElementById("lang-en").classList.toggle("active",l==="en");
  applyI18n();renderAll();
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",S.theme);
  document.getElementById("icon-moon").style.display=S.theme==="light"?"":"none";
  document.getElementById("icon-sun").style.display=S.theme==="dark"?"":"none";
}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";persist();applyTheme()}
function setView(v){
  S.view=v;persist();
  const feedish=v==="feed"||v==="saved";
  document.getElementById("view-feed").style.display=feedish?"":"none";
  document.getElementById("view-cal").style.display=v==="cal"?"":"none";
  document.getElementById("view-ai").style.display=v==="ai"?"":"none";
  document.getElementById("feed-toolbar").style.display=v==="saved"?"none":"";
  ["feed","cal","saved","ai"].forEach(k=>{
    const n=document.getElementById("nav-"+k),m=document.getElementById("mnav-"+k);
    if(n)n.classList.toggle("active",k===v);
    if(m)m.classList.toggle("active",k===v);
  });
  if(v==="cal")renderCal();
  if(feedish)render();
  window.scrollTo({top:0});
}

function toggleDD(e){
  e.stopPropagation();
  document.getElementById("min-dd").classList.toggle("open");
}
document.addEventListener("click",e=>{
  const dd=document.getElementById("min-dd");
  if(dd&&!dd.contains(e.target))dd.classList.remove("open");
});
function latestPub(id){let m="";allItems().forEach(it=>{if(it.min===id&&it.pub&&it.pub>m)m=it.pub});return m}
function minOrder(){
  return Object.keys(MINISTRIES).sort((a,b)=>{
    const f=(S.favs.includes(b)?1:0)-(S.favs.includes(a)?1:0);
    if(f)return f;
    return latestPub(b).localeCompare(latestPub(a));
  });
}

function agCore(n){return String(n).replace(/\s*\([^)]*\)\s*$/,"").trim()}
function agMatch(it,name){
  if(it.ag===name)return true;
  const core=agCore(name),ab=(String(name).match(/\(([^)]+)\)\s*$/)||[])[1];
  const hay=[it.title,it.sum,it.chair,it.ag].filter(Boolean).join(" ");
  if(core&&hay.includes(core))return true;
  if(ab)return ab.split("/").some(x=>{x=x.trim();return x.length>1&&hay.includes(x)});
  return false;
}
function agObj(){
  if(!S.agFilter||!S.minFilter||typeof AGENCIES==="undefined")return null;
  return(AGENCIES[S.minFilter]||[]).find(a=>a.n===S.agFilter)||null;
}

function itemStatus(it){
  const t=todayISO();
  if(!it.evStart)return"none";
  const end=it.evEnd||it.evStart;
  if(end<t)return"past";
  if(it.evStart<=t)return"ongoing";
  return"upcoming";
}

/* ---------- feed ---------- */
function filteredItems(){
  let list=allItems();
  if(S.view==="saved")list=list.filter(it=>S.saved.includes(it.id));
  else{
    if(S.minFilter)list=list.filter(it=>it.min===S.minFilter);
    if(S.agFilter)list=list.filter(it=>agMatch(it,S.agFilter));
    if(S.typeFilter!=="all")list=list.filter(it=>it.type===S.typeFilter);
    if(S.statusFilter!=="all")list=list.filter(it=>itemStatus(it)===S.statusFilter);
    const q=(S.qApplied||"").trim().toLowerCase();
    if(q)list=list.filter(it=>{
      const m=MINISTRIES[it.min];
      return[it.title,it.sum,it.bkb,it.loc,it.chair,m&&m.th,m&&m.en].filter(Boolean).join(" ").toLowerCase().includes(q);
    });
  }
  if(S.view!=="saved"&&(S.statusFilter==="upcoming"||S.statusFilter==="ongoing"))
    return list.slice().sort((a,b)=>(a.evStart||"9999").localeCompare(b.evStart||"9999"));
  return list.slice().sort((a,b)=>(b.pub||"").localeCompare(a.pub||""));
}

function fetchLive(){
  if(typeof fetch==="undefined")return Promise.resolve(false);
  let ctl=null,to=null;
  try{ctl=new AbortController();to=setTimeout(()=>ctl.abort(),25000)}catch(e){}
  return fetch(LIVE_API+"/api/news",ctl?{signal:ctl.signal}:{})
    .then(r=>r.json())
    .then(d=>{
      if(to)clearTimeout(to);
      if(!d||!Array.isArray(d.items))return false;
      S.live=d.items.filter(x=>x&&x.title).map((x,i)=>({
        id:5000+i,
        min:MINISTRIES[x.min]?x.min:"opm",
        type:x.type==="benefit"?"benefit":"news",
        ag:x.ag||null,
        title:String(x.title).slice(0,200),
        sum:String(x.sum||x.desc||"").slice(0,500),
        pub:x.pub||todayISO(),
        evStart:x.evStart||null,evEnd:x.evEnd||null,
        loc:x.loc||"",chair:x.chair||"",act:x.act||"",src:x.link||x.src||"",
        srcName:x.srcName||"",srcType:x.srcType||"official",
        img:(typeof x.img==="string"&&/^https:\/\//.test(x.img))?x.img:null
      }));
      return true;
    }).catch(()=>{if(to)clearTimeout(to);return false});
}

  const i=s.toLowerCase().indexOf(q.toLowerCase());

  const q=searchQ();if(!q)return;
  S.qApplied=q;

  box.classList.remove("open");box.innerHTML="";

function renderSug(q){
  const box=document.getElementById("search-sug");
  if(!q){box.classList.remove("open");box.innerHTML="";return}
  const ql=q.toLowerCase();
  let html='<div class="sg-item sg-apply" onclick="applySearch()">'+
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'+
    '<div class="sg-t">'+T("searchAllFor")+' “<b>'+esc(q)+'</b>”</div><small>Enter ↵</small></div>';
  let found=false;
  const mins=Object.keys(MINISTRIES).filter(id=>{
    const m=MINISTRIES[id];
    return m.th.includes(q)||m.en.toLowerCase().includes(ql)||m.abbr.toLowerCase().includes(ql)||
      (typeof AGENCIES!=="undefined"&&AGENCIES[id]&&AGENCIES[id].some(a=>a.n.toLowerCase().includes(ql)));
  });
  if(mins.length){found=true;
    html+='<div class="sg-head">'+T("sgMinistries")+"</div>"+
      mins.slice(0,5).map(id=>{
        const m=MINISTRIES[id];
        return'<div class="sg-item" onclick="sugMin(\''+id+'\')">'+logoHTML(id)+
          '<div class="sg-t">'+hlText(S.lang==="th"?m.th:m.en,q)+"</div><small>"+T("viewMinistry")+"</small></div>";
      }).join("");}
  const its=allItems().filter(it=>{
    const m=MINISTRIES[it.min];
    return[it.title,it.sum,it.loc,it.chair,m&&m.th,m&&m.en].filter(Boolean).join(" ").toLowerCase().includes(ql);
  }).slice(0,6);
  if(its.length){found=true;
    html+='<div class="sg-head">'+T("sgItems")+"</div>"+
      its.map(it=>'<div class="sg-item" onclick="sugItem('+it.id+')">'+logoHTML(it.min)+
        '<div class="sg-t">'+hlText(it.title,q)+"</div><small>"+fmtDate(it.evStart||it.pub)+"</small></div>").join("");}
  if(!found)html+='<div class="sg-head">'+T("emptySearch")+"</div>";
  box.innerHTML=html;box.classList.add("open");
}

function buildCopyText(it){
  const m=MINISTRIES[it.min];
  return[it.title,
    (m?(S.lang==="th"?m.th:m.en):"")+(it.ag?" · "+it.ag:""),
    it.evStart?T("dEvent")+": "+fmtRange(it)+(it.time?" · "+it.time:""):"",
    it.loc?T("dLoc")+": "+it.loc:"",
    it.sum,
    it.src||""].filter(Boolean).join("\n");
}
function copyItem(id){
  const it=allItems().find(x=>x.id===id);
  if(!it)return;
  const txt=buildCopyText(it),done=()=>toast(T("copiedToast"));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done()}catch(e){}
  ta.remove();
}
// ---- export saved events as .ics ----
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function icsD(d){return String(d).replace(/-/g,"")}
function icsNextDay(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10).replace(/-/g,"")}
function buildICS(items){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ThaiGov Connect//TH","CALSCALE:GREGORIAN"];
  items.forEach(it=>{
    L.push("BEGIN:VEVENT",
      "UID:tgc-"+it.id+"@thaigov-connect",
      "DTSTAMP:"+icsD(it.pub||it.evStart)+"T000000Z",
      "DTSTART;VALUE=DATE:"+icsD(it.evStart),
      "DTEND;VALUE=DATE:"+icsNextDay(it.evEnd||it.evStart),
      "SUMMARY:"+icsEsc(it.title));
    if(it.loc)L.push("LOCATION:"+icsEsc(it.loc));
    L.push("DESCRIPTION:"+icsEsc((it.sum||"")+(it.src?" "+it.src:"")),"END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function downloadServer(){
  const el=document.getElementById("server-src");
  if(!el)return;
  const blob=new Blob([el.textContent.trim()+"\n"],{type:"text/javascript;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="thaigov-live-server.js";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(T("dlServerDone"));
}
function downloadICS(){
  const evs=allItems().filter(it=>S.saved.includes(it.id)&&it.evStart);
  if(!evs.length){toast(T("icsNone"));return}
  const blob=new Blob([buildICS(evs)],{type:"text/calendar;charset=utf-8"});

  const a=document.createElement("a");a.href=url;a.download="thaigov-connect-events.ics";

}

function calEvsBase(){ // กิจกรรมทั้งหมดตามตัวกรองประเภท (ยังไม่กรองกระทรวงจาก legend)
  let evs=allItems().filter(it=>it.evStart);
  if(S.calFilter==="saved")evs=evs.filter(it=>S.saved.includes(it.id));
  else if(S.calFilter==="fav")evs=evs.filter(it=>S.favs.includes(it.min));
  else if(S.calFilter==="benefit")evs=evs.filter(it=>it.type==="benefit");
  return evs;
}
function calEvs(){
  let evs=calEvsBase();
  if(S.calMinSel.length)evs=evs.filter(it=>S.calMinSel.includes(it.min));
  return evs;
}
function setCalFilter(f){
  S.calFilter=f;
  if(f==="saved"&&!S.saved.length)toast(T("calNoSaved"));
  if(f==="fav"&&!S.favs.length)toast(T("calNoFav"));
  persist();renderCal();
}
function toggleCalMin(id){
  const i=S.calMinSel.indexOf(id);
  if(i>=0)S.calMinSel.splice(i,1);else S.calMinSel.push(id);
  renderCal();
}
function calToday(){S.calYM=null;renderCal()}
function calMove(d){
  if(!S.calYM){const n=new Date();S.calYM=[n.getFullYear(),n.getMonth()]}
  let[y,m]=S.calYM;m+=d;
  if(m<0){m=11;y--}if(m>11){m=0;y++}
  S.calYM=[y,m];renderCal();
}
function renderCal(){
  const now=new Date();
  const[y,m]=S.calYM||[now.getFullYear(),now.getMonth()];
  document.getElementById("cal-title").textContent=
    T("months")[m]+" "+(S.lang==="th"?y+543:y);
  document.getElementById("cal-dows").innerHTML=
    T("dows").map(d=>'<div class="cal-dow">'+d+"</div>").join("");
  const first=new Date(y,m,1);
  const dim=new Date(y,m+1,0).getDate();
  const nWeeks=Math.ceil((first.getDay()+dim)/7);
  const tISO=todayISO();
  // ---- ตัวกรองประเภท (chips) ----
  const base=allItems().filter(it=>it.evStart);
  const counts={all:base.length,saved:base.filter(it=>S.saved.includes(it.id)).length,
    fav:base.filter(it=>S.favs.includes(it.min)).length,benefit:base.filter(it=>it.type==="benefit").length};
  document.getElementById("cal-chips").innerHTML=[
    ["all",T("calAll")],["saved","★ "+T("calSaved")],["fav","⭐ "+T("calFav")],["benefit",T("calBenefit")]
  ].map(([f,lb])=>'<button class="cchip'+(S.calFilter===f?" on":"")+'" onclick="setCalFilter(\''+f+'\')">'+
    lb+'<span class="cnt">'+counts[f]+"</span></button>").join("");
  const evs=calEvs();
  const usedMins=new Set();calEvsBase().forEach(e=>usedMins.add(e.min));
  let weeksHTML="";
  for(let w=0;w<nWeeks;w++){
    const wStart=new Date(y,m,1-first.getDay()+w*7);
    const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const wsISO=iso(wStart);
    const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+6);
    const weISO=iso(wEnd);
    let cells="";
    for(let d=0;d<7;d++){
      const dt=new Date(wStart);dt.setDate(dt.getDate()+d);
      const out=dt.getMonth()!==m;
      const isT=iso(dt)===tISO;
      cells+='<div class="day-bg'+(out?" out":"")+'" style="grid-column:'+(d+1)+'"></div>';
      cells+='<div class="day-num'+(out?" out":"")+'" style="grid-column:'+(d+1)+'">'+
        (isT?'<span class="tn">'+dt.getDate()+"</span>":dt.getDate())+"</div>";
    }
    const segs=[];
    evs.forEach(e=>{
      const eS=e.evStart,eE=e.evEnd||e.evStart;
      if(eE<wsISO||eS>weISO)return;
      const sCol=eS<=wsISO?0:daysUntil2(wsISO,eS);
      const eCol=eE>=weISO?6:daysUntil2(wsISO,eE);
      segs.push({e,sCol,eCol,contL:eS<wsISO,contR:eE>weISO});
      usedMins.add(e.min);
    });
    segs.sort((a,b)=>a.e.evStart.localeCompare(b.e.evStart)||(a.e.id-b.e.id));
    const lanes=[];
    segs.forEach(s=>{
      let L=0;
      while(lanes[L]&&lanes[L].some(x=>!(s.eCol<x.sCol||s.sCol>x.eCol)))L++;
      (lanes[L]=lanes[L]||[]).push(s);s.lane=L;
    });
    segs.forEach(s=>{
      const mm=MINISTRIES[s.e.min];
      const sv=S.saved.includes(s.e.id);
      cells+='<div class="cal-bar'+(sv?" sv":"")+(s.contL?" contL":"")+(s.contR?" contR":"")+'"'+
        ' style="grid-column:'+(s.sCol+1)+"/"+(s.eCol+2)+";grid-row:"+(s.lane+2)+";background:"+(mm?mm.color:"#64748b")+'"'+
        ' onclick="openModal('+s.e.id+')" title="'+(sv?"★ ":"")+esc(s.e.title)+'">'+
        (sv?'<span class="svstar">★</span>':"")+(mm?mm.abbr+" ":"")+esc(s.e.title)+"</div>";
    });
    weeksHTML+='<div class="cal-week">'+cells+"</div>";
  }
  document.getElementById("cal-weeks").innerHTML=weeksHTML;
  document.getElementById("cal-legend").innerHTML=
    (S.saved.length?"<span>★ "+T("savedMark")+"</span>":"")+
    [...usedMins].map(id=>{
      const mm=MINISTRIES[id];
      const on=S.calMinSel.includes(id),dim=S.calMinSel.length&&!on;
      return'<span class="lg'+(on?" on":"")+(dim?" dim":"")+'" onclick="toggleCalMin(\''+id+'\')">'+
        '<i style="background:'+mm.color+'"></i>'+esc(S.lang==="th"?mm.th:mm.en)+"</span>";
    }).join("");
  document.getElementById("cal-hint").textContent=usedMins.size>1?T("calLegendHint"):"";
  // ---- agenda: รายการกิจกรรมของเดือนนี้ อ่านง่ายกว่าแท่งสี ----
  const mS=y+"-"+String(m+1).padStart(2,"0")+"-01";
  const mE=y+"-"+String(m+1).padStart(2,"0")+"-"+String(dim).padStart(2,"0");
  const mons=evs.filter(e=>(e.evEnd||e.evStart)>=mS&&e.evStart<=mE)
    .sort((a,b)=>a.evStart.localeCompare(b.evStart)||(a.id-b.id));
  document.getElementById("cal-agenda").innerHTML=
    "<h4>"+T("calAgenda")+" · "+mons.length+"</h4>"+
    (mons.length?mons.map(e=>{
      const mm=MINISTRIES[e.min],sv=S.saved.includes(e.id);
      const d1=parseInt(e.evStart.slice(8),10),d2=parseInt((e.evEnd||e.evStart).slice(8),10);
      const sameM=e.evStart.slice(0,7)===(e.evEnd||e.evStart).slice(0,7);
      const dtxt=e.evStart===(e.evEnd||e.evStart)?String(d1):sameM?d1+"–"+d2:fmtRange(e);
      const isNow=e.evStart<=tISO&&(e.evEnd||e.evStart)>=tISO;
      return'<div class="agn-row" onclick="openModal('+e.id+')">'+
        '<div class="agn-date'+(isNow?" today":"")+'">'+dtxt+" "+T("months")[m].slice(0,3)+(isNow?" ●":"")+"</div>"+
        '<div class="agn-dot" style="background:'+(mm?mm.color:"#64748b")+'"></div>'+
        '<div class="agn-t">'+esc(e.title)+"<small>"+(mm?esc(S.lang==="th"?mm.th:mm.en):"")+(e.loc?" · "+esc(e.loc):"")+"</small></div>"+
        '<div class="agn-tags">'+(e.type==="benefit"?'<span class="agn-b">Benefit</span>':"")+(sv?'<span class="agn-sv">★</span>':"")+"</div></div>";
    }).join(""):'<div class="cal-empty">'+T("calEmpty")+"</div>");
}

const TH_MONTHS={"มกราคม":1,"ม.ค.":1,"กุมภาพันธ์":2,"ก.พ.":2,"มีนาคม":3,"มี.ค.":3,"เมษายน":4,"เม.ย.":4,
"พฤษภาคม":5,"พ.ค.":5,"มิถุนายน":6,"มิ.ย.":6,"กรกฎาคม":7,"ก.ค.":7,"สิงหาคม":8,"ส.ค.":8,
"กันยายน":9,"ก.ย.":9,"ตุลาคม":10,"ต.ค.":10,"พฤศจิกายน":11,"พ.ย.":11,"ธันวาคม":12,"ธ.ค.":12};
let aiDraft=null;
function aiExtract(){
  const txt=(document.getElementById("ai-text").value||"").trim();
  const out=document.getElementById("ai-result");
  const addBtn=document.getElementById("ai-add-btn");
  aiDraft=null;addBtn.style.display="none";
  if(!txt){out.textContent="";return}
  let minId=null;
  Object.keys(MINISTRIES).forEach(id=>{
    const mm=MINISTRIES[id];
    if(txt.includes(mm.th)||txt.toLowerCase().includes(mm.en.toLowerCase())||txt.includes(mm.abbr))minId=minId||id;
  });
  const moNames=Object.keys(TH_MONTHS).sort((a,b)=>b.length-a.length).map(s=>s.replace(/\./g,"\\.")).join("|");
  const dateRe=new RegExp("(\\d{1,2})\\s*("+moNames+")\\s*(\\d{4})?","g");
  const found=[];let mt;
  while((mt=dateRe.exec(txt))!==null){
    let yy=mt[3]?Number(mt[3]):(new Date().getFullYear()+543);
    if(yy>2400)yy-=543;
    found.push(yy+"-"+String(TH_MONTHS[mt[2]]).padStart(2,"0")+"-"+String(mt[1]).padStart(2,"0"));
  }
  found.sort();
  const evStart=found[0]||null;
  const evEnd=found.length>1?found[found.length-1]:null;
  const lines=txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const title=(lines[0]||"").slice(0,120);
  const sum=txt.replace(/\s+/g," ").slice(0,260)+(txt.length>260?"…":"");
  const isBenefit=/เข้าร่วม|สมัคร|เปิดรับ|ร่วมมือ|สนับสนุน|MOU|partnership|ลดหย่อน|สิทธิประโยชน์/i.test(txt);
  let locM=txt.match(/ณ\s+([^\n,]{4,60})/);
  if(locM){const cut=locM[1].search(/\s+(?:โดยมี|ซึ่งมี|พร้อมด้วย|เมื่อวันที่)/);if(cut>3)locM=[locM[0],locM[1].slice(0,cut)];}
  const chairM=txt.match(/(?:ประธาน|โดยมี)\s*(?:ในพิธี)?\s*(?:คือ|ได้แก่)?\s*([^\n,]{4,70})/);
  aiDraft={id:Date.now(),custom:true,min:minId||"mdes",type:isBenefit?"benefit":"news",
    eng:isBenefit?["p"]:null,title:title,pub:todayISO(),
    evStart:evStart,evEnd:evEnd&&evEnd!==evStart?evEnd:null,time:null,
    loc:locM?locM[1].trim():null,chair:chairM?chairM[1].trim():null,
    act:null,sum:sum,bkb:null,src:null};
  const mm=MINISTRIES[aiDraft.min];
  out.innerHTML="<b>"+T(aiDraft.type)+"</b> · "+esc(S.lang==="th"?mm.th:mm.en)+"<br>"+
    "<b>"+esc(title)+"</b><br>"+
    (evStart?T("dEvent")+": "+fmtRange(aiDraft)+"<br>":"")+
    (aiDraft.loc?T("dLoc")+": "+esc(aiDraft.loc)+"<br>":"")+
    (aiDraft.chair?T("dChair")+": "+esc(aiDraft.chair)+"<br>":"")+
    esc(sum);
  addBtn.style.display="";
}
function aiAdd(){
  if(!aiDraft)return;
  S.custom.push(aiDraft);persist();
  aiDraft=null;
  document.getElementById("ai-add-btn").style.display="none";
  document.getElementById("ai-text").value="";
  document.getElementById("ai-result").textContent="";
  toast(T("aiAdded"));
  setView("feed");
}
function aiImage(inp){
  const f=inp.files&&inp.files[0];

}

// ตรวจการเชื่อมต่อข่าวสดอัตโนมัติตอนเปิดแอพ — ถ้าเซิร์ฟเวอร์รันอยู่ ข่าวสดจะเข้ามาเองทันที
fetchLive().then(ok=>{
  liveStatus=ok?"on":"off";
  if(ok){S.lastRefresh=Date.now();persist();updateRefreshLabel()}
  renderAll();
});
</script>

<script type="text/plain" id="server-src">
#!/usr/bin/env node
/*
 * ThaiGov Connect — Live News Connector Server
 * ---------------------------------------------
 * ตัวเชื่อมต่อดึงข่าวจริงจาก RSS/API ทางการของหน่วยงานรัฐ แล้วเสิร์ฟให้แอพ
 * ThaiGov-Connect.html ผ่าน http://localhost:8787/api/news (เปิด CORS ให้แล้ว)
 *
 * วิธีใช้:
 *   1) ติดตั้ง Node.js 18 ขึ้นไป (มี fetch ในตัว ไม่ต้องลง dependency ใด ๆ)
 *   2) รัน:  node thaigov-live-server.js
 *   3) เปิด ThaiGov-Connect.html แล้วกดปุ่มรีเฟรช → แอพจะดึงข่าวสดอัตโนมัติ
 *
 * เพิ่ม/แก้แหล่งข่าวได้ที่ SOURCES ด้านล่าง (รองรับ RSS/Atom ทุกตัว)
 * หมายเหตุ: feed ที่ทำเครื่องหมาย verify ควรตรวจ URL ปัจจุบันของหน่วยงานอีกครั้ง
 * เพราะเว็บราชการย้าย path บ่อย — ตัว parser เป็น generic RSS ใช้ได้กับทุก feed
 */

const http = require("http");

const PORT = process.env.PORT || 8787;
const CACHE_MS = 10 * 60 * 1000; // cache 10 นาที กันยิง feed ถี่เกิน

// ---------------------------------------------------------------------------
// แหล่งข่าว: ใส่ RSS/Atom URL ของหน่วยงาน + ministry key ของแอพ (+ ag ถ้าเป็นระดับกรม/องค์การ)
// ministry keys: opm mod mfa mof mots msdhs mhesi moac mot mnre mdes moen moc
//                moi moj mol mocu moe moph moind reg
// ---------------------------------------------------------------------------
const SOURCES = [
  // ---- ทุกอันด้านล่างนี้ "ยืนยันแล้ว" ว่าดึงได้จริง (ทดสอบ 1 ก.ย. 2026) ----
  { name: "TAT Newsroom (ททท.)", url: "https://tatnews.org/feed/",
    min: "mots", ag: "การท่องเที่ยวแห่งประเทศไทย (ททท.)" },
  { name: "กระทรวงการท่องเที่ยวและกีฬา", url: "https://www.mots.go.th/mots_en/api/rss/category/200",
    min: "mots" },
  { name: "กรมสรรพากร — ข่าวประชาสัมพันธ์", url: "https://www.rd.go.th/publish.xml",
    min: "mof", ag: "กรมสรรพากร" },
  { name: "กรมสรรพากร — กฎหมายภาษีใหม่", url: "https://www.rd.go.th/law.xml",
    min: "mof", ag: "กรมสรรพากร" },
  { name: "สวทช. (NSTDA)", url: "https://www.nstda.or.th/home/feed/",
    min: "mhesi", ag: "สำนักงานพัฒนาวิทยาศาสตร์และเทคโนโลยีแห่งชาติ (สวทช.)" },
  { name: "กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม", url: "https://www.mnre.go.th/rss",
    min: "mnre" },
  { name: "กระทรวงคมนาคม — ข่าวทั่วไป", url: "https://rapi.mot.go.th/api/rss/latest-news/MOT",
    min: "mot" },
  { name: "กระทรวงคมนาคม — ข่าวผู้บริหาร", url: "https://rapi.mot.go.th/api/rss/latest-news/Executive",
    min: "mot" },
];

// ---------------------------------------------------------------------------
// แหล่งที่ "ตรวจแล้วใช้ไม่ได้" (1 ก.ย. 2026) — อย่าเปิดกลับโดยไม่เช็คใหม่:
//   thaigov.go.th/news/rss        -> เว็บเป็น Next.js SPA ไม่มี XML feed
//   prd.go.th/th/rss              -> connection refused
//   mof.go.th/rss/news.xml        -> 404 (ใช้ feed กรมสรรพากรแทน)
//   depa.or.th/th/rss, etda.or.th/th/rss -> 404 (ไม่มี RSS แล้ว)
//   boi.go.th                     -> บล็อกด้วย Incapsula (403)
//   sec.or.th/rss                 -> 403, nbtc.go.th/rss -> 404
//   mol.go.th/rss, businesseventsthailand.com/rss -> feed มีแต่ว่างเปล่า
//   moph, moi, moen, m-culture, sso, gistda, nia, dbd, sme -> ไม่มี RSS/404/timeout
// หน่วยงานเหล่านี้ครอบคลุมผ่าน Google News RSS ด้านล่างแทน
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Google News RSS — ปิดช่องกระทรวงที่ไม่มี RSS ของตัวเอง (เสถียร, มาตรฐาน RSS 2.0)
// ข้อสังเกต: ข่าวมาจากสื่อที่รายงานถึงหน่วยงาน ไม่ใช่ประกาศตรงจากหน่วยงานเสมอไป
// ---------------------------------------------------------------------------
const GNEWS = [
  ["opm",   'สำนักนายกรัฐมนตรี'],
  ["mod",   'กระทรวงกลาโหม'],
  ["mfa",   'กระทรวงการต่างประเทศ'],
  ["msdhs", 'กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์'],
  ["moac",  'กระทรวงเกษตรและสหกรณ์'],
  ["mdes",  'กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม'],
  ["moen",  'กระทรวงพลังงาน'],
  ["moc",   'กระทรวงพาณิชย์'],
  ["moi",   'กระทรวงมหาดไทย'],
  ["moj",   'กระทรวงยุติธรรม'],
  ["mol",   'กระทรวงแรงงาน'],
  ["mocu",  'กระทรวงวัฒนธรรม'],
  ["moe",   'กระทรวงศึกษาธิการ'],
  ["moph",  'กระทรวงสาธารณสุข'],
  ["moind", 'กระทรวงอุตสาหกรรม'],
  ["reg",   '"ธนาคารแห่งประเทศไทย" OR "ก.ล.ต." OR "กสทช."'],
];
GNEWS.forEach(([min, q]) => SOURCES.push({
  name: "Google News — " + q.replace(/"/g, ""),
  url: "https://news.google.com/rss/search?q=" +
    encodeURIComponent(q.startsWith('"') || q.includes(" OR ") ? q : '"' + q + '"') +
    "&hl=th&gl=TH&ceid=TH:th",
  min, gn: true,
}));

// ---------------------------------------------------------------------------
// สื่อภายนอกที่น่าเชื่อถือ (RSS ยืนยันแล้ว 2 ก.ย. 2026) — ประเภท "ข้อมูลจากแหล่งอื่น"
// เก็บเฉพาะข่าวที่เกี่ยวข้องกับหน่วยงานรัฐ (ต้อง match MIN_KEYWORDS) กันข่าวนอกเรื่อง
// ตรวจแล้วใช้ไม่ได้: เดลินิวส์ (feed ว่างเปล่า), BBC Thai (ปิดบริการ),
//   ประชาชาติ (403), Bangkok Post (paywall 402), Thai PBS / MGR (404)
// ---------------------------------------------------------------------------
const MEDIA = [
  ["ไทยรัฐ",          "https://www.thairath.co.th/rss/news"],
  ["มติชน",           "https://www.matichon.co.th/feed"],
  ["ข่าวสด",          "https://www.khaosod.co.th/feed"],
  ["กรุงเทพธุรกิจ",    "https://www.bangkokbiznews.com/rss"],
  ["ฐานเศรษฐกิจ",     "https://www.thansettakij.com/rss"],
  ["The Standard",   "https://thestandard.co/feed/"],
  ["อินโฟเควสท์",      "https://www.infoquest.co.th/feed"],
];
MEDIA.forEach(([name, url]) => SOURCES.push({ name, url, media: true }));

// คำสำคัญ → จัดข่าวเข้ากระทรวง อัตโนมัติ (ใช้กับ feed รวม เช่น thaigov/PRD)
const MIN_KEYWORDS = {
  mof: ["กระทรวงการคลัง", "สรรพากร", "ภาษี", "สรรพสามิต", "ศุลกากร", "ธนารักษ์"],
  mdes: ["ดิจิทัล", "ไซเบอร์", "depa", "ETDA", "PDPA", "PDPC"],
  moph: ["สาธารณสุข", "โรงพยาบาล", "อนามัย", "สปสช", "วัคซีน"],
  moc: ["พาณิชย์", "ส่งออก", "การค้า", "DITP", "ทรัพย์สินทางปัญญา"],
  mots: ["ท่องเที่ยว", "กีฬา", "ททท"],
  moac: ["เกษตร", "ชลประทาน", "ประมง", "ปศุสัตว์", "ข้าว"],
  mol: ["แรงงาน", "ประกันสังคม", "จัดหางาน", "ค่าจ้าง"],
  moe: ["ศึกษาธิการ", "โรงเรียน", "นักเรียน", "สพฐ"],
  mhesi: ["อุดมศึกษา", "วิจัย", "นวัตกรรม", "อว.", "มหาวิทยาลัย", "GISTDA", "สวทช"],
  mnre: ["สิ่งแวดล้อม", "ทรัพยากรธรรมชาติ", "ป่าไม้", "อุทยาน", "มลพิษ", "โลกร้อน"],
  moen: ["พลังงาน", "ไฟฟ้า", "น้ำมัน", "โซลาร์", "กฟผ"],
  mot: ["คมนาคม", "รถไฟ", "ทางหลวง", "สนามบิน", "ขนส่ง"],
  moi: ["มหาดไทย", "จังหวัด", "ท้องถิ่น", "กฟภ", "ประปา"],
  moj: ["ยุติธรรม", "ราชทัณฑ์", "DSI", "บังคับคดี"],
  mfa: ["ต่างประเทศ", "ทูต", "วีซ่า", "กงสุล"],
  mod: ["กลาโหม", "กองทัพ", "ทหาร"],
  msdhs: ["พัฒนาสังคม", "พม.", "ผู้สูงอายุ", "เด็กและเยาวชน", "คนพิการ"],
  mocu: ["วัฒนธรรม", "ศิลปะ", "มรดก", "soft power"],
  moind: ["อุตสาหกรรม", "โรงงาน", "SME", "เหมืองแร่"],
  reg: ["ธปท", "แบงก์ชาติ", "ก.ล.ต.", "กสทช", "คปภ"],
};

const BENEFIT_KEYWORDS = ["เปิดรับสมัคร", "สมัครได้", "ขอรับทุน", "เงินสนับสนุน", "สิทธิประโยชน์",
  "ลงทะเบียน", "รับข้อเสนอ", "ขอรับการส่งเสริม", "grant", "apply", "funding", "อบรมฟรี", "สัมมนา"];

// ---------------------------------------------------------------------------
// Generic RSS/Atom parser (regex-based, no dependencies)
// ---------------------------------------------------------------------------
function decode(s) {
  return String(s || "")
    .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
    .replace(/<[^>]+>/g, " ")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#0?39;/g, "'").replace(/&nbsp;/g, " ")
    .replace(/\s+/g, " ").trim();
}
function tag(block, name) {
  const m = block.match(new RegExp("<" + name + "[^>]*>([\\s\\S]*?)</" + name + ">", "i"));
  return m ? m[1] : "";
}
function toISO(d) {
  const t = new Date(d);
  if (isNaN(t)) return null;
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function itemImage(b) { // สกัดรูป/อินโฟกราฟฟิคที่แนบมากับ feed
  let m = b.match(/<enclosure[^>]+url="([^"]+)"[^>]*(?:type="image[^"]*")?/i);
  if (m && /\.(jpe?g|png|webp|gif)(\?|$)/i.test(m[1] || "")) return m[1];
  m = b.match(/<media:content[^>]+url="([^"]+)"/i) || b.match(/<media:thumbnail[^>]+url="([^"]+)"/i);
  if (m) return m[1];
  m = b.match(/<img[^>]+src=["']([^"']+)["']/i); // รูปแรกใน description (CDATA)
  if (m) return m[1];
  m = decode(b).match(/<img[^>]+src=["']([^"']+)["']/i); // description ที่ escape เป็น &lt;img&gt;
  if (m) return m[1];
  m = b.match(/<enclosure[^>]+url="([^"]+)"/i);
  return m ? m[1] : null;
}
function parseFeed(xml, src) {
  const blocks = xml.match(/<item[\s>][\s\S]*?<\/item>/gi) || xml.match(/<entry[\s>][\s\S]*?<\/entry>/gi) || [];
  return blocks.slice(0, 20).map(b => {
    let title = decode(tag(b, "title"));
    if (src.gn) title = title.replace(/\s+-\s+[^-]+$/, ""); // ตัดชื่อสำนักข่าวท้าย title ของ Google News
    const sum = decode(tag(b, "description") || tag(b, "summary") || tag(b, "content")).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    let link = decode(tag(b, "link"));
    if (!link) { const m = b.match(/<link[^>]*href="([^"]+)"/i); link = m ? m[1] : ""; }
    const pub = toISO(decode(tag(b, "pubDate") || tag(b, "published") || tag(b, "updated") || tag(b, "dc:date")));
    if (!title) return null;
    const hay = title + " " + sum;
    let min = src.min || null;
    if (!src.ag && !src.gn) { // feed รวม/สื่อภายนอก → จับกระทรวงจากคำสำคัญ
      for (const [k, words] of Object.entries(MIN_KEYWORDS)) {
        if (words.some(w => hay.includes(w))) { min = k; break; }
      }
    }
    if (src.media && !min) return null; // ข่าวสื่อภายนอกที่ไม่เกี่ยวกับหน่วยงานรัฐ → ตัดทิ้ง
    return {
      min,
      ag: src.ag || null,
      type: BENEFIT_KEYWORDS.some(w => hay.toLowerCase().includes(w.toLowerCase())) ? "benefit" : "news",
      title, sum: sum.slice(0, 400), pub, link,
      chair: src.name,
      srcName: src.name,
      srcType: src.media ? "media" : src.gn ? "gnews" : "official",
      img: itemImage(b),
    };
  }).filter(Boolean);
}

// ---------------------------------------------------------------------------
let cache = { at: 0, items: [], errors: [] };

async function collect() {
  if (Date.now() - cache.at < CACHE_MS && cache.items.length) return cache;
  const items = [], errors = [];
  await Promise.all(SOURCES.map(async src => {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(src.url, {
        signal: ctl.signal,
        headers: { "user-agent": "ThaiGovConnect/1.0 (+news aggregator)" },
      });
      clearTimeout(to);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const xml = await r.text();
      const got = parseFeed(xml, src);
      items.push(...got);
      console.log("  ✓ " + src.name + ": " + got.length + " items");
    } catch (e) {
      errors.push(src.name + ": " + e.message);
      console.log("  ✗ " + src.name + ": " + e.message);
    }
  }));
  // dedupe ด้วย title, เรียงล่าสุดก่อน
  const seen = new Set();
  const uniq = items.filter(it => { const k = it.title.slice(0, 80); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => String(b.pub || "").localeCompare(String(a.pub || "")));
  cache = { at: Date.now(), items: uniq, errors };
  return cache;
}

http.createServer(async (req, res) => {
  res.setHeader("Access-Control-Allow-Origin", "*");
  res.setHeader("Content-Type", "application/json; charset=utf-8");
  if (req.url.startsWith("/api/news")) {
    console.log(new Date().toISOString() + " GET /api/news — fetching feeds…");
    const { items, errors } = await collect();
    res.end(JSON.stringify({ ok: true, count: items.length, errors, items }));
  } else {
    res.end(JSON.stringify({ ok: true, hint: "GET /api/news" }));
  }
}).listen(PORT, () => {
  console.log("ThaiGov Connect live connector running → http://localhost:" + PORT + "/api/news");
  console.log("เปิด ThaiGov-Connect.html แล้วกดปุ่มรีเฟรชได้เลย");
});

</script>
